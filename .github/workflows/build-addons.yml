name: Build MoH-NX Addon Launchers

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Spearhead and Breakthrough
    runs-on: ubuntu-24.04

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm \
            switch-dev \
            switch-sdl2 \
            switch-sdl2_image \
            switch-sdl2_mixer \
            switch-sdl2_ttf \
            switch-openal-soft \
            switch-libpng \
            switch-libjpeg-turbo \
            switch-zlib

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake

      - name: Build addon launchers
        run: |
          cmake --build build \
            --target launch_openmohaa_spearhead \
            --parallel 4

          cmake --build build \
            --target launch_openmohaa_breakthrough \
            --parallel 4

      - name: Find launcher ELFs
        run: |
          echo "Spearhead:"
          find build -type f -iname '*spearhead*' -print

          echo "Breakthrough:"
          find build -type f -iname '*breakthrough*' -print

      - name: Package NROs
        run: |
          mkdir -p artifacts

          SPEARHEAD_ELF=$(find build -type f \
            -name 'launch_openmohaa_spearhead.elf' | head -n 1)

          BREAKTHROUGH_ELF=$(find build -type f \
            -name 'launch_openmohaa_breakthrough.elf' | head -n 1)

          echo "Spearhead ELF: $SPEARHEAD_ELF"
          echo "Breakthrough ELF: $BREAKTHROUGH_ELF"

          test -n "$SPEARHEAD_ELF"
          test -n "$BREAKTHROUGH_ELF"

          nacptool --create \
            "Medal of Honor Allied Assault - Spearhead" \
            "OpenMoHAA NX" \
            "1.0.0" \
            artifacts/spearhead.nacp

          nacptool --create \
            "Medal of Honor Allied Assault - Breakthrough" \
            "OpenMoHAA NX" \
            "1.0.0" \
            artifacts/breakthrough.nacp

          elf2nro \
            "$SPEARHEAD_ELF" \
            artifacts/openmohaa-spearhead.nro \
            --nacp=artifacts/spearhead.nacp

          elf2nro \
            "$BREAKTHROUGH_ELF" \
            artifacts/openmohaa-breakthrough.nro \
            --nacp=artifacts/breakthrough.nacp

      - name: Verify NROs
        run: |
          ls -lh artifacts/*.nro
          file artifacts/*.nro

      - name: Upload NROs
        uses: actions/upload-artifact@v4
        with:
          name: openmohaa-nx-addons
          path: |
            artifacts/openmohaa-spearhead.nro
            artifacts/openmohaa-breakthrough.nro
