name: Build MoH-NX Addon Launchers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm \
            switch-dev \
            switch-sdl2 \
            switch-openal-soft \
            switch-libpng \
            switch-libjpeg-turbo \
            switch-zlib

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CLIENT=ON \
            -DBUILD_SERVER=OFF

      - name: Build launcher targets
        run: |
          cmake --build build --target openmohaa_launcher_spearhead --parallel 4
          cmake --build build --target openmohaa_launcher_breakthrough --parallel 4

      - name: Show build files
        run: |
          echo "=== SPEARHEAD ==="
          find build -type f -name "*spearhead*" -print

          echo "=== BREAKTHROUGH ==="
          find build -type f -name "*breakthrough*" -print

          echo "=== NRO ==="
          find build -type f -name "*.nro" -print

      - name: Create NRO launchers
        run: |
          mkdir -p artifacts

          find build -type f -name "launch_openmohaa_spearhead.elf" -exec \
            elf2nro {} artifacts/openmohaa-spearhead.nro \;

          find build -type f -name "launch_openmohaa_breakthrough.elf" -exec \
            elf2nro {} artifacts/openmohaa-breakthrough.nro \;

          ls -lh artifacts

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openmohaa-nx-addons
          path: artifacts/
          if-no-files-found: error
