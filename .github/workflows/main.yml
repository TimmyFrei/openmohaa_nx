name: Import switch branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-switch:
    runs-on: ubuntu-latest

    steps:
      - name: Clone upstream switch branch
        run: |
          git clone --branch switch --single-branch \
            https://github.com/NaGaa95/openmohaa_nx.git \
            openmohaa_nx

      - name: Push switch branch
        working-directory: openmohaa_nx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:switch
