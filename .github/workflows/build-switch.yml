
name: Build Nintendo Switch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-switch:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout Nintendo Switch port
        uses: actions/checkout@v4

      - name: Checkout OpenMoHAA engine
        uses: actions/checkout@v4
        with:
          repository: openmoh/openmohaa
          path: openmohaa

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y flex bison

      - name: Verify engine sources
        run: |
          echo "Checking required engine files..."
          for f in \
            code/sys/sys_main.c \
            code/gamespy/common/gamespy_common.cpp \
            code/gamespy/gcdkey/gcdkey.cpp \
            code/qcommon/cm_trace.cpp
          do
            if [ -f "openmohaa/$f" ]; then
              echo "FOUND: openmohaa/$f"
            else
              echo "MISSING: openmohaa/$f"
            fi
          done

          if [ ! -f openmohaa/code/gamespy/common/gamespy_common.cpp ] || \
             [ ! -f openmohaa/code/gamespy/gcdkey/gcdkey.cpp ] || \
             [ ! -f openmohaa/code/qcommon/cm_trace.cpp ]; then
            echo "Required engine source files are missing."
            exit 1
          fi
          
          echo "GameSpy directory:"
          ls -la openmohaa/code/gamespy/common \
                 openmohaa/code/gamespy/gcdkey || true

          echo "Collision-model files:"
          find openmohaa/code/qcommon -maxdepth 1 -iname '*trace*' -o -iname '*world*'

      - name: Configure OpenMoHAA for Nintendo Switch
        run: |
          echo "Checking upstream source tree..."
          test -f "$GITHUB_WORKSPACE/openmohaa/code/sys/sys_main.c"
          echo "Upstream sources found"

          cmake -S nx -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/devkita64-libnx.cmake \
            -DOPENMOHAA_ROOT="$GITHUB_WORKSPACE/openmohaa" \
            -DNX_TARGET_GAME=1 \
            -DNX_RENDERER=gl1 \
            -DNX_ENABLE_NXLINK=OFF \
            -DNX_USE_CODEC_MAD=ON

          echo "Configured source root:"
          grep '^OPENMOHAA_ROOT:PATH=' build/CMakeCache.txt

      - name: Build
        run: |
          cmake --build build --parallel 2

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp build/openmohaa.nro artifact/openmohaa.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: openmohaa-switch-spearhead
          path: artifact/openmohaa.nro
