

name: Build Nintendo Switch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-switch:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout Nintendo Switch port
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout OpenMoHAA engine
        uses: actions/checkout@v4
        with:
          repository: openmoh/openmohaa
          path: openmohaa
          fetch-depth: 0

      
      - name: Patch IPv6 compatibility for Switch
        run: |
          cd openmohaa
          python3 - <<'PY'
          from pathlib import Path

          p = Path("code/qcommon/net_ip.c")
          s = p.read_text()

          needle = "#endif\n\nstatic qboolean usingSocks"
          replacement = """#endif

          #ifdef __SWITCH__
          struct ipv6_mreq {
              struct in6_addr ipv6mr_multiaddr;
              int ipv6mr_interface;
          };

          static unsigned int if_nametoindex(const char *ifname) {
              (void)ifname;
              return 0;
          }
          #endif

          static qboolean usingSocks"""

          if needle not in s:
              raise SystemExit("Could not find insertion point in net_ip.c")

          p.write_text(s.replace(needle, replacement, 1))
          PY
    

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y flex bison

      - name: Inspect upstream source layout
        run: |
          echo "=== GameSpy common ==="
          find openmohaa/code/gamespy/common -maxdepth 1 -type f | sort | head -60

          echo "=== GameSpy gcdkey ==="
          find openmohaa/code/gamespy/gcdkey -maxdepth 1 -type f | sort | head -60

          echo "=== Collision trace files ==="
          find openmohaa/code/qcommon -maxdepth 1 -iname '*trace*' -type f | sort

          echo "=== Upstream revision ==="
          git -C openmohaa log -1 --oneline

          echo "=== linklist headers ==="
          find openmohaa/code -iname '*linklist*' -o -iname '*list*link*'

          echo "=== references to linklist.h ==="
          grep -R -n --include='*.h' --include='*.c' --include='*.cpp' \
          'linklist\.h' openmohaa/code

      - name: Install parser generators
        run: |
          apt-get update
          apt-get install -y flex bison    

      - name: Check CMake source compatibility
        run: |
          echo "=== Missing explicitly referenced source files ==="
          python3 - <<'PY'
          import re
          from pathlib import Path

          cmake = Path("nx/CMakeLists.txt").read_text()
          root = Path("openmohaa")

          paths = sorted(set(re.findall(
              r'\$\{SRC\}/([A-Za-z0-9_./+-]+\.(?:cpp|cxx|cc|c))(?=[\s)])',
              cmake
          )))

          missing = []
          for rel in paths:
              if not (root / "code" / rel).is_file():
                  missing.append(rel)

          if missing:
              for path in missing:
                  print("MISSING:", path)
              print(f"\nTotal missing files: {len(missing)}")
          else:
              print("All explicitly referenced source files exist.")
          PY

          echo "=== Upstream commit ==="
          git -C openmohaa log -1 --oneline

          
      - name: Configure OpenMoHAA for Nintendo Switch
        run: |
          echo "Checking upstream source tree..."
          test -f "$GITHUB_WORKSPACE/openmohaa/code/sys/sys_main.c"
          echo "Upstream sources found"

          cmake -S nx -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/devkita64-libnx.cmake \
            -DOPENMOHAA_ROOT="$GITHUB_WORKSPACE/openmohaa" \
            -DNX_TARGET_GAME=1 \
            -DNX_RENDERER=gl1 \
            -DNX_ENABLE_NXLINK=OFF \
            -DNX_USE_CODEC_MAD=ON

          echo "Configured source root:"
          grep '^OPENMOHAA_ROOT:PATH=' build/CMakeCache.txt

      - name: Diagnose missing linklist.h
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/openmohaa"
          
          echo "=== Search for linklist.h ==="
          find openmohaa -type f -iname 'linklist.h'

          echo "=== Search for related headers ==="
          find openmohaa/code -type f \( -iname '*linklist*' -o -iname '*list*link*' \)

          echo "=== All references to linklist.h ==="
          grep -R -n --include='*.h' --include='*.c' --include='*.cpp' \
            'linklist\.h' openmohaa/code || true

          echo "=== Include directories in CMake ==="
          grep -n -E 'include_directories|target_include_directories|OPENMOHAA_ROOT|GAME_SOURCES' nx/CMakeLists.txt
          
          echo "=== OpenMoHAA commit ==="
          git -C openmohaa log -1 --format="%H %s"

          echo "=== OpenMoHAA version ==="
          git -C openmohaa describe --tags --always

          echo "=== Source layout ==="
          find openmohaa/code -maxdepth 1 -type d | sort

          echo "=== Port repository commit ==="
          git log -1 --format="%H %s"

          echo "=== Port source references ==="
          grep -R -n \
          --include='*.cmake' --include='CMakeLists.txt' \
          'OPENMOHAA_ROOT\|add_subdirectory.*fgame\|g_utils.h' nx

          echo "=== Relevant upstream file history ==="
          git -C openmohaa log -8 --oneline -- code/fgame/g_utils.h
          git -C openmohaa log -8 --oneline -- code/fgame/archive.h
          git -C openmohaa log -8 --oneline -- code/fgame/baseimp.h

          echo "=== Port repository remotes ==="
          git remote -v

          echo "=== Port branch and history ==="
          git branch -a
          git log -10 --oneline

          echo "=== Recent port changes to build files ==="
          git log -10 --oneline -- nx/CMakeLists.txt .github/workflows/build-switch.yml

          echo "=== OpenMoHAA corepp move ==="
          git -C openmohaa show --stat --oneline ecf70528

          echo "=== Current problematic declarations ==="
          sed -n '145,225p' openmohaa/code/fgame/g_utils.h
          sed -n '65,95p' openmohaa/code/fgame/baseimp.h
          sed -n '250,350p' openmohaa/code/fgame/archive.h

          echo "=== Game target configuration ==="
          sed -n '360,430p' nx/CMakeLists.txt

          echo "=== Entity structure ==="
          grep -R -n -E 'struct gentity_s|typedef struct gentity_s|gentity_t' \
            openmohaa/code/qcommon openmohaa/code/fgame/g_local.h | head -60

          echo "=== con_set Archive declarations ==="
          grep -n -E 'class con_set|class con_map|Archive\(' \
            openmohaa/code/corepp/con_set.h openmohaa/code/fgame/archive.h

          echo "=== Port history ==="
          git log --all --oneline -20

      - name: Find g_utils.h includes
        run: |
          echo "=== Files including g_utils.h ==="
          grep -R -n \
            --include='*.h' --include='*.c' --include='*.cpp' \
            '#include.*g_utils\.h' \
            openmohaa/code nx || true

          echo "=== References to G_GetEntity ==="
          grep -R -n \
            --include='*.h' --include='*.c' --include='*.cpp' \
            'G_GetEntity' \
            openmohaa/code nx || true

      - name: Diagnose g_utils header leakage
        run: |
          echo "=== Game headers included outside fgame ==="
          grep -R -n \
            --include='*.h' --include='*.c' --include='*.cpp' \
            -E '#include[[:space:]]*[<"](g_local|g_utils)\.h[>"]' \
            openmohaa/code nx \
            | grep -v 'openmohaa/code/fgame/' || true

          echo "=== Exact failing source ==="
          grep -n -B 8 -A 8 'g_entities\[entnum\]\.entity' \
            openmohaa/code/fgame/g_utils.h

          echo "=== gentity_t declaration and guards ==="
          grep -n -B 5 -A 25 'typedef struct gentity_s' \
            openmohaa/code/fgame/g_public.h

          echo "=== Client compile commands referencing game headers ==="
          grep -n -E 'client/.*\.(cpp|c)|g_utils\.h|g_local\.h' \
            build/compile_commands.json | head -100

      - name: Diagnose client source lists
        run: |
          echo "=== CMake source list definitions ==="
          sed -n '300,375p' nx/CMakeLists.txt
          sed -n '405,510p' nx/CMakeLists.txt

          echo "=== All references to g_local.h and g_utils.h ==="
          grep -R -n \
            --include='*.h' --include='*.c' --include='*.cpp' \
            -E 'g_local\.h|g_utils\.h|G_GetEntity' \
            openmohaa/code nx || true

          echo "=== CMake generator and export settings ==="
          grep -E 'CMAKE_GENERATOR:|CMAKE_EXPORT_COMPILE_COMMANDS:|CMAKE_TOOLCHAIN_FILE:' \
            build/CMakeCache.txt || true

          echo "=== Build target files ==="
          find build/CMakeFiles/openmohaa.dir -type f \
            \( -name '*.o' -o -name '*.obj' \) | head -80

      - name: Build
        run: |
          cmake --build build --parallel 2

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp build/openmohaa.nro artifact/openmohaa.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: openmohaa-switch-spearhead
          path: artifact/openmohaa.nro
